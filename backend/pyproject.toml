[project]
name = "nichepilot"
version = "0.1.0"
description = "NichePilot – Affiliate Automation OS (E0 Foundation & AI Infrastructure)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi~=0.163.2",
    "uvicorn[standard]~=0.54.0",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
    "sqlalchemy[asyncio]~=2.1.9",
    "psycopg[binary,pool]~=3.3.9",
    "alembic~=1.20",
    "procrastinate~=3.11.0",
    "croniter~=7.0",
    "anthropic~=2.10",
    "openai~=3.54",
    "structlog~=26.1",
    "argon2-cffi~=25.1",
    "httpx~=0.28.1",
]

[dependency-groups]
dev = [
    "pytest~=9.2",
    "pytest-asyncio~=1.5",
    "testcontainers[postgres]~=4.15",
    "respx~=0.23",
    "ruff~=0.17",
    "mypy~=2.4",
    "import-linter~=2.16",
    "detect-secrets~=1.5",
    "pyyaml~=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nichepilot"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "E501"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["nichepilot"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nichepilot.core.*", "nichepilot.ai.*", "nichepilot.jobs.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "mock: test dùng MockAIProvider/FakeLLMProvider – KHÔNG được tính là kiểm thử provider thật",
    "live: gọi API thật có phí – chỉ chạy thủ công khi chủ sở hữu cho phép",
    "integration: cần PostgreSQL thật",
]
addopts = "-m 'not live' --strict-markers"
