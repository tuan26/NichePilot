name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - name: Lint & format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Import boundaries (FR-001, FR-025)
        run: uv run lint-imports
      - name: Unit, contract, integration tests (không gọi API có phí – marker live bị loại)
        run: uv run pytest -m "not live"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: detect-secrets so với baseline đã rà soát (SC-008, N1 – docs/operations/security.md)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python scripts/check_secrets.py

  smoke:
    # SC-001/SC-002/FR-074: healthy ≤ 5 phút, RAM nghỉ ≤ 3 GB, hot reload ở chế độ dev (mock, không gọi API có phí)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke prod (make up)
        run: SMOKE_REPORT=smoke-prod.txt deploy/tests/smoke.sh prod
      - name: Stop prod stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/env/.env down -v
      - name: Smoke dev (hot reload)
        run: SMOKE_REPORT=smoke-dev.txt deploy/tests/smoke.sh dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: smoke-*.txt
      - name: Compose logs on failure
        if: failure()
        run: |
          cat smoke-*.txt || true
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml --env-file deploy/env/.env ps -a
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml --env-file deploy/env/.env logs --tail=60

  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Báo cáo truy vết (SC-011) – thất bại nếu FR Must thiếu test
        working-directory: backend
        run: uv run --no-project python scripts/traceability_report.py --strict --out traceability-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-report
          path: backend/traceability-report.md

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start stack (mock provider, paid calls disabled)
        run: |
          cp deploy/env/.env.example deploy/env/.env
          # E1: SearXNG cần secret cục bộ sinh ngẫu nhiên mỗi lần chạy (không commit, giống deploy/tests/smoke.sh)
          sed -i "s/^SEARXNG_SECRET=.*/SEARXNG_SECRET=$(openssl rand -hex 32)/" deploy/env/.env
          make up
      - name: Playwright E2E
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e -- --pass-with-no-tests --trace off
      - name: Restart stack with simulated sources (E1 E2E needs an empty database; development only)
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/env/.env down -v
          sed -i "s/^DISCOVERY_SOURCE_MODE=.*/DISCOVERY_SOURCE_MODE=mock/" deploy/env/.env
          make up
      - name: Playwright E2E – E1 discovery
        working-directory: frontend
        run: E2E_SUITE=discovery npm run test:e2e -- --trace off
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/env/.env logs
