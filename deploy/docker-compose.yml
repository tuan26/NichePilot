# NichePilot – Docker Compose (Linux server và Windows Docker Desktop/WSL2).
# Khởi động: make up
name: nichepilot

x-backend: &backend
  build:
    context: ../backend
    target: runtime
  image: nichepilot-backend:local
  env_file: ./env/.env
  restart: unless-stopped
  volumes:
    - logs:/var/log/nichepilot
    # E1 (X4): sổ xóa bằng chứng – volume riêng, KHÔNG nằm trong dump PostgreSQL (research R-09)
    - erasure-ledger:/var/lib/nichepilot/erasure-ledger
    # E1 (X1): cấu hình SearXNG sinh từ source_policies (chỉ nguồn ALLOWED đang bật)
    - searxng-config:/var/lib/nichepilot/searxng
  logging:
    # Stdout chỉ là bản sao để xem nhanh; bản lưu chính là file log theo ngày trong volume `logs` (FR-057)
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    env_file: ./env/.env
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 1.0

  migrate:
    <<: *backend
    restart: "no"
    # E1 (X4): áp dụng erasure ledger TRƯỚC khi api/worker khởi động; lỗi → thoát ≠ 0 → api/worker không chạy
    command: ["sh", "-c", "alembic upgrade head && python -m nichepilot.jobs.erasure_ledger --strict"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 1.0

  worker:
    <<: *backend
    command: ["python", "-m", "nichepilot.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 1g
    cpus: 1.0

  web:
    build:
      context: ../frontend
      target: runtime
    image: nichepilot-web:local
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:8080"
    depends_on:
      api: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 128m
    cpus: 0.5

  # E1 (X1, research R-02): metasearch tự host, AGPL-3.0-or-later, image chính thức KHÔNG sửa mã.
  # Chỉ mạng nội bộ Compose (không publish cổng). Lần đầu chạy dùng settings.base.yml (keep_only rỗng = không engine nào),
  # sau đó dùng cấu hình do NichePilot sinh từ nguồn ALLOWED đang bật. Không có nguồn ALLOWED → không truy vấn ra ngoài.
  # Trình thu thập có trình duyệt (Playwright, profile `browser-fetcher`) là tùy chọn, tắt mặc định – thêm ở T128.
  searxng:
    image: searxng/searxng:2026.11.18-b867c56a5
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - '[ -f /etc/searxng/settings.yml ] || cp /opt/nichepilot/settings.base.yml /etc/searxng/settings.yml; exec /usr/local/searxng/entrypoint.sh'
    environment:
      GRANIAN_HOST: 0.0.0.0
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET chưa được đặt trong deploy/env/.env}
    volumes:
      - ./searxng/settings.base.yml:/opt/nichepilot/settings.base.yml:ro
      - searxng-config:/etc/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q OK"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 256m
    cpus: 0.5

  # Backup theo lịch (FR-073): docker compose --profile ops up -d backup ; backup thủ công: make backup
  backup:
    image: postgres:17-alpine
    profiles: ["ops"]
    env_file: ./env/.env
    environment:
      PGHOST: postgres
      BACKUP_DIR: /backups
    entrypoint: ["/scripts/backup-cron.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ../backups:/backups
      - erasure-ledger:/ledger:ro  # E1 (X4): sao kèm bản sổ xóa vào backup
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
  logs:
  erasure-ledger:
  searxng-config:
